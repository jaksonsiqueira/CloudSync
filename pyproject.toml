[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsync"
version = "0.1.0"
description = "Aplicativo Windows para backup e sincronização com Google Drive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.2",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "keyring>=25.0",
    "oauthlib>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

